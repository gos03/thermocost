name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          script: |
            set -e
            cd /opt/thermocost
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build
            sleep 5
            docker compose exec -T app python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"
            docker image prune -f --filter label=com.docker.compose.project=thermocost
