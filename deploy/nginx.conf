# Nginx configuration for Thermocost3
# Place this in /etc/nginx/sites-available/thermocost3
# Then symlink to /etc/nginx/sites-enabled/thermocost3

upstream thermocost {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Redirect HTTP to HTTPS if using SSL
    # Uncomment the line below and comment out the proxy_pass section
    # return 301 https://$server_name$request_uri;

    location / {
        proxy_pass http://thermocost;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://thermocost;
        access_log off;
    }
}

